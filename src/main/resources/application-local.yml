# 로컬 환경 전용 설정 (ELK + Prometheus 연동)
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  cookie-secure: false

logging:
  level:
    root: INFO
    org.dallyeo.matuabom: DEBUG
    org.springframework.security: INFO

# 로컬에서 Prometheus 상세 메트릭 활성
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # HTTP 요청 히스토그램 (p50/p95/p99)
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
