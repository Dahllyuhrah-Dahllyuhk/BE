server:
  forward-headers-strategy: framework

spring:
  application:
    name: matuabom

  # ── MongoDB (단일 저장소) ────────────────────────────────────────────
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_NAME:matuabom}

  # ── OAuth2 ────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-authentication-method: client_secret_post
            provider: kakao

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ── App 설정 ──────────────────────────────────────────────────────────
app:
  frontend-base-url: ${FRONTEND_ORIGIN:http://localhost:3000}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-secret: ${ADMIN_SECRET:admin1234}
  encrypt-key: ${ENCRYPT_KEY:}  # 누락 시 AesEncryptor 내부 개발용 기본키 사용 (운영은 반드시 설정)
  google-webhook-token: ${GOOGLE_WEBHOOK_TOKEN:}
  jwt:
    access-token-seconds: 7200        # 2시간
    refresh-token-seconds: 2592000    # 30일

# ── Actuator (헬스체크 전용) ───────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true   # /actuator/health/liveness, /actuator/health/readiness 활성화
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mongo:
      enabled: true     # MongoDB 연결 확인
