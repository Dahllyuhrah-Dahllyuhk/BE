server:
  forward-headers-strategy: framework

spring:
  application:
    name: matuabom

  # ── MongoDB (Meeting, CalendarEvent, GoogleOAuthClient) ──────────────
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_NAME:matuabom}

    # ── Redis (RefreshToken, InviteCode 캐시, 블랙리스트) ──────────────
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ── PostgreSQL (User, Friend, InviteCode, Timetable) ─────────────────
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/matuabom}
    username: ${POSTGRES_USER:matuabom}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}   # 반드시 환경변수로 명시 (local/dev: update, prod: validate)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── OAuth2 ────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-authentication-method: client_secret_post
            provider: kakao

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ── App 설정 ──────────────────────────────────────────────────────────
app:
  frontend-base-url: ${FRONTEND_ORIGIN:http://localhost:3000}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-secret: ${ADMIN_SECRET}
  encrypt-key: ${ENCRYPT_KEY:}  # 누락 시 AesEncryptor 내부 개발용 기본키 사용 (운영은 반드시 설정)
  google-webhook-token: ${GOOGLE_WEBHOOK_TOKEN:}
  jwt:
    access-token-seconds: 7200        # 2시간
    refresh-token-seconds: 2592000    # 30일

# ── Actuator (헬스체크 전용) ───────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true   # /actuator/health/liveness, /actuator/health/readiness 활성화
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true     # PostgreSQL 연결 확인
    mongo:
      enabled: true     # MongoDB 연결 확인
    redis:
      enabled: true     # Redis 연결 확인
