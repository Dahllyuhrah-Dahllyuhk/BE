plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'matuabom'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // -------------------------------------------------------------------------
    // 🌐 Spring Boot Core & Web (핵심 기능)
    // -------------------------------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-web'           // RESTful API, 내장 톰캣 등 웹 기능
    implementation 'org.springframework.boot:spring-boot-starter-webflux'      // 비동기/논블로킹 웹 (WebClient 등)
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // 유효성 검사 (Jakarta Validation API)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // 헬스체크 (/actuator/health)
    implementation 'io.micrometer:micrometer-registry-prometheus'              // Prometheus 메트릭 노출 (/actuator/prometheus)

    // -------------------------------------------------------------------------
    // 💾 Data Persistence (데이터베이스)
    // -------------------------------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb' // MongoDB 연동
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // Redis 연동 (토큰, 캐시)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // PostgreSQL JPA 연동
    runtimeOnly 'org.postgresql:postgresql'                                     // PostgreSQL 드라이버

    // -------------------------------------------------------------------------
    // 🔐 Security & Authorization
    // -------------------------------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-security'     // Spring Security 핵심
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'// OAuth 2.0 클라이언트 (Google 로그인 등)
    implementation("io.jsonwebtoken:jjwt-api:0.12.6")                          // JWT API
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")                            // JWT 구현체
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")                         // JWT JSON 파서

    // -------------------------------------------------------------------------
    // 🗓️ Google Services (캘린더 연동)
    // -------------------------------------------------------------------------
    implementation 'com.google.api-client:google-api-client:2.8.0'             // Google API 클라이언트 핵심
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'  // Google OAuth 클라이언트 (데스크톱/테스트용)
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20250404-2.0.0' // Google Calendar API 서비스
    implementation 'com.google.http-client:google-http-client-jackson2:1.46.0' // Google HTTP 클라이언트 Jackson2 지원

    // -------------------------------------------------------------------------
    // 🛠️ Utilities & Development
    // -------------------------------------------------------------------------
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'   // API 문서화 (Swagger UI)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'    // Java 8 Date/Time 객체 JSON 처리 지원
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'                        // .env 파일 환경 변수 로드
    implementation 'com.bucket4j:bucket4j-core:8.10.1'                         // Rate Limiting

    // Lombok (컴파일 시 자동 코드 생성)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // -------------------------------------------------------------------------
    // 🧪 Testing
    // -------------------------------------------------------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'                                         // 테스트용 인메모리 DB
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // -------------------------------------------------------------------------
    // ☁️ Cloud & External Services (현재 주석 처리됨)
    // -------------------------------------------------------------------------
//    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.4.0")
//    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'
//    implementation 'io.awspring.cloud:spring-cloud-aws-starter'
//    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
//    runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    useJUnitPlatform()
}
